# =========================
# Hyprlock configuration
# =========================

# General settings
general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = true
    grace = 5
    ignore_empty_input = true
    fractional_scaling = 2
}

# Background
background {
    monitor =
    path = ~/Pictures/Wallpapers/blurry.jpg
    blur_passes = 3
    blur_size = 5
    noise = 0.0117
    contrast = 1.0
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(ffffffee)
    font_size = 96
    font_family = JetBrains Mono Bold

    position = 0, 400
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(ffffffbb)
    font_size = 24
    font_family = JetBrains Mono Medium

    position = 0, 250
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    color = rgba(ffffffdd)
    font_size = 20
    font_family = JetBrains Mono

    position = 0, 100
    halign = center
    valign = center
}

# Password input box
input-field {
    monitor =

    size = 360, 70
    outline_thickness = 3

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgba(89b4faff)
    inner_color = rgba(11111bee)
    font_color = rgba(ffffffff)

    fade_on_empty = true
    placeholder_text = <span foreground="##ffffff99">Enter password...</span>

    hide_input = false

    position = 0, -40
    halign = center
    valign = center

    font_family = JetBrains Mono
    font_size = 20
}


